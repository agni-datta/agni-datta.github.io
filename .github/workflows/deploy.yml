name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read tool versions
        id: versions
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          toolchain = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"rust={toolchain['channel']}", file=output)
              print(f"components={','.join(toolchain['components'])}", file=output)
              print(f"targets={','.join(toolchain['targets'])}", file=output)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: ${{ steps.versions.outputs.components }}
          targets: ${{ steps.versions.outputs.targets }}

      - name: Install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s "$(cat .dprint-version)"
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check and build
        run: cargo site check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
