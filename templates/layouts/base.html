<!DOCTYPE html>
<html lang="en" data-theme="pending" data-navigation="closed">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ data.site.title }}{% endblock title %}</title>
    <meta name="description" content="{{ data.site.description }}">
    <link rel="canonical" href="{{ data.site.base_url }}{{ canonical_path }}">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&amp;family=Space+Mono:wght@400&amp;display=swap"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="/assets/css/site.css?v={{ build.cache_key }}">
    <noscript>
      <style>
      html[data-theme="pending"] body {
        visibility: visible;
      }
      .theme-toggle, .drawer-toggle, .citation-copy, .email-contact {
        display: none;
      }
      .site-header {
        display: flex;
        flex-wrap: wrap;
      }
      .header-actions {
        flex-basis: 100%;
        justify-content: flex-start;
      }
      .site-nav {
        border: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        height: auto;
        padding: 0;
        position: static;
        transform: none;
        visibility: visible;
        width: auto;
      }
      </style>
    </noscript>
  </head>

  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include "components/header.html" %}

    <main id="content" data-route="{{ current_route }}" tabindex="-1">
      {% block content %}{% endblock content %}
    </main>

    {% include "components/footer.html" %}
    <script type="module" src="/assets/wasm/bootstrap.js?v={{ build.cache_key }}"></script>
  </body>
</html>
