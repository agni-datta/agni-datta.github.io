[package]
name = "webapp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
  "Clipboard",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlDocument",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "Node",
  "NodeList",
  "Window",
]
