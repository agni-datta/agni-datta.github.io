intro = """
I'm a PhD student in the [Security and Privacy Group](https://web.inf.ed.ac.uk/security-privacy) at the [School of Informatics](https://www.ed.ac.uk/informatics), [University of Edinburgh](https://www.ed.ac.uk/), where I'm fortunate to be supervised by [Damiano Abram](https://damianoabram.github.io/) and [Rahul Santhanam](https://www.cs.ox.ac.uk/people/rahul.santhanam/). Previously, I was a predoctoral researcher at the [Trust Lab](https://trustlab.iitb.ac.in/), [IIT Bombay](https://www.iitb.ac.in/), and a research assistant at [CISPA](https://cispa.de/en). I completed my integrated Master's degree at [VIT Bhopal University](https://vitbhopal.ac.in/), where I worked on my thesis under the supervision of [Matteo Campanelli](https://binarywhales.com/). I'm broadly interested in theoretical computer science, mainly cryptography, computational complexity, and pseudorandomness.
"""
